[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ucoolele-song-convert"
version = "0.1.0"
description = "Convert Ucoolele song YAML files into binaries and generated C++ sources"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
ucoolele-generate-bin = "ucoolele_song_convert.generate_bin:main"
ucoolele-generate-sources = "ucoolele_song_convert.generate_sources:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ucoolele_song_convert = ["templates/*.template"]
